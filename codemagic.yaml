workflows:
  ios-live-wire:
    name: Live Wire iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: livewire_api_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.buhumaid3.livewire
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="CURRENT_PROJECT_VERSION=$CM_BUILD_ID"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
